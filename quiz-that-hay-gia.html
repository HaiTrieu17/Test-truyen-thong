<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Trắc nghiệm ATTT - Thật hay Giả?</title>
<style>
  :root{--bg:#0f172a;--card:#1e293b;--border:rgba(255,255,255,.06);--t1:#f8fafc;--t2:#cbd5e1;--t3:#94a3b8;--t4:#64748b;--t5:#475569;--blue:#3b82f6;--green:#22c55e;--red:#ef4444;--yellow:#f59e0b;}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--t1);font-family:'Inter','Segoe UI',system-ui,sans-serif;min-height:100vh}
  .hide{display:none!important}
  
  /* ── Start Screen ── */
  #startScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:20px}
  .start-box{max-width:480px;width:100%;text-align:center}
  .start-box h1{font-size:26px;font-weight:800;letter-spacing:-.02em;margin:0 0 6px}
  .start-box .sub{color:var(--t4);font-size:13px;margin-bottom:28px;line-height:1.5}
  .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:24px;text-align:left}
  .cat-card{background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;display:flex;align-items:center;gap:8px}
  .cat-card .icon{font-size:18px}
  .cat-card .lbl{color:var(--t2);font-size:12px;font-weight:500}
  .cat-card .cnt{color:var(--t5);font-size:10px}
  .form-area{background:rgba(255,255,255,.04);border-radius:12px;padding:16px;margin-bottom:20px;text-align:left}
  .form-area label{color:var(--t3);font-size:11px;font-weight:600;display:block;margin-bottom:6px}
  .form-area input{width:100%;background:var(--bg);border:1px solid rgba(255,255,255,.1);border-radius:8px;padding:10px 12px;color:var(--t1);font-size:14px;outline:none;margin-bottom:12px}
  .form-area input:last-child{margin-bottom:0}
  .btn-row{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn-primary{background:linear-gradient(135deg,#2563eb,#3b82f6);color:#fff;border:none;border-radius:10px;padding:12px 28px;font-size:14px;font-weight:700;cursor:pointer}
  .btn-primary:disabled{background:#334155;opacity:.5;cursor:default}
  .btn-secondary{background:rgba(255,255,255,.06);color:var(--t3);border:1px solid var(--border);border-radius:10px;padding:12px 20px;font-size:13px;font-weight:600;cursor:pointer}
  
  /* ── Quiz Screen ── */
  #quizScreen{display:none;flex-direction:column;min-height:100vh}
  .topbar{background:var(--card);padding:10px 16px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:10}
  .topbar .qnum{font-size:15px;font-weight:700}
  .topbar .qnum span{color:var(--t5);font-size:12px;font-weight:400}
  .dots{display:flex;gap:4px;align-items:center}
  .dot{width:8px;height:5px;border-radius:3px;background:rgba(255,255,255,.08);transition:all .3s}
  .dot.active{width:18px;background:var(--blue)}
  .dot.correct{background:var(--green)}
  .dot.wrong{background:var(--red)}
  .timer-area{display:flex;align-items:center;gap:6px}
  .timer-bar{width:50px;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .timer-fill{height:100%;border-radius:3px;transition:width 1s linear,background .3s}
  .timer-num{font-size:13px;font-weight:700;font-variant-numeric:tabular-nums;min-width:24px;text-align:right}
  .quiz-body{max-width:600px;width:100%;margin:0 auto;padding:20px 16px;flex:1}
  .q-cat{display:flex;align-items:center;gap:6px;justify-content:center;margin-bottom:10px}
  .q-cat .badge{color:#60a5fa;font-size:12px;font-weight:600}
  .q-prompt{color:var(--t1);font-size:16px;font-weight:600;text-align:center;margin-bottom:20px;line-height:1.5}
  .answer-btns{display:flex;gap:12px;justify-content:center;margin-top:4px}
  .btn-real,.btn-fake{flex:1;max-width:180px;padding:14px 20px;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .15s}
  .btn-real{border:2px solid rgba(22,163,74,.3);background:rgba(22,163,74,.08);color:#4ade80}
  .btn-real:hover{background:rgba(22,163,74,.18);border-color:rgba(22,163,74,.5)}
  .btn-fake{border:2px solid rgba(220,38,38,.3);background:rgba(220,38,38,.08);color:#f87171}
  .btn-fake:hover{background:rgba(220,38,38,.18);border-color:rgba(220,38,38,.5)}
  .feedback{margin-top:4px;border-radius:12px;padding:16px}
  .feedback .head{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
  .feedback .head .icon{font-size:20px}
  .feedback .head .label{font-weight:700;font-size:15px}
  .feedback .head .ans-badge{margin-left:auto;font-size:12px;font-weight:700;padding:3px 10px;border-radius:6px}
  .feedback p{color:var(--t2);font-size:13px;line-height:1.7}
  .next-btn{display:flex;justify-content:center;margin-top:16px}
  
  /* ── Mockups ── */
  .email-mock{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;max-width:520px;margin:0 auto;font-family:'Segoe UI',Arial,sans-serif}
  .email-mock .toolbar{background:#f8fafc;padding:10px 14px;border-bottom:1px solid #e2e8f0;display:flex;align-items:center;gap:8px}
  .email-mock .toolbar .circ{width:12px;height:12px;border-radius:50%}
  .email-mock .body{padding:14px 16px}
  .email-mock .sender{display:flex;align-items:center;gap:10px;margin-bottom:10px}
  .email-mock .avatar{width:36px;height:36px;border-radius:50%;background:#3b82f6;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:14px;flex-shrink:0}
  .email-mock .from-name{font-size:13px;font-weight:600;color:#1e293b}
  .email-mock .from-addr{font-size:11px;color:#64748b;word-break:break-all}
  .email-mock .subject{font-size:15px;font-weight:700;color:#0f172a;margin-bottom:6px}
  .email-mock .to{font-size:11px;color:#94a3b8;margin-bottom:12px}
  .email-mock .content{font-size:13px;color:#334155;line-height:1.7;white-space:pre-wrap;margin-bottom:16px}
  .email-mock .cta{display:inline-block;background:#2563eb;color:#fff;padding:10px 24px;border-radius:6px;font-size:13px;font-weight:600}
  .email-mock .link-preview{font-size:10px;color:#94a3b8;margin-top:4px;word-break:break-all}
  .email-mock .footer{font-size:10px;color:#94a3b8;border-top:1px solid #f1f5f9;padding-top:10px;margin-top:12px}
  
  .web-mock{background:#fff;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;max-width:440px;margin:0 auto}
  .web-mock .browser-bar{background:#1e293b;padding:8px 10px}
  .web-mock .browser-dots{display:flex;gap:6px;margin-bottom:6px}
  .web-mock .browser-dots span{width:10px;height:10px;border-radius:50%}
  .web-mock .url-bar{background:#0f172a;border-radius:6px;padding:6px 10px;display:flex;align-items:center;gap:6px}
  .web-mock .url-bar .lock{font-size:12px}
  .web-mock .url-bar .url{color:#e2e8f0;font-size:11px;word-break:break-all;font-family:monospace}
  .web-mock .ssl-info{font-size:9px;color:#64748b;margin-top:3px;padding-left:4px}
  .web-mock .page{padding:24px 20px;text-align:center}
  .web-mock .logo{font-size:24px;font-weight:800;color:#1e40af;margin-bottom:4px}
  .web-mock .title{font-size:13px;color:#64748b;margin-bottom:20px}
  .web-mock .field{margin-bottom:10px;text-align:left}
  .web-mock .field label{font-size:11px;color:#475569;font-weight:600;display:block;margin-bottom:3px}
  .web-mock .field .input{background:#f8fafc;border:1px solid #e2e8f0;border-radius:6px;padding:10px 12px;font-size:12px;color:#cbd5e1}
  .web-mock .submit{background:#2563eb;color:#fff;padding:10px 20px;border-radius:6px;font-size:14px;font-weight:600;margin-top:6px;margin-bottom:14px;display:inline-block}
  .web-mock .extras{display:flex;justify-content:center;gap:16px}
  .web-mock .extras span{font-size:11px;color:#3b82f6}
  
  .sms-mock{background:#f0f2f5;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;max-width:380px;margin:0 auto}
  .sms-mock .header{background:#075e54;padding:10px 14px;display:flex;align-items:center;gap:10px}
  .sms-mock .header .av{width:32px;height:32px;border-radius:50%;background:#25d366;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:11px}
  .sms-mock .header .name{color:#fff;font-size:14px;font-weight:600}
  .sms-mock .header .type{color:rgba(255,255,255,.67);font-size:10px}
  .sms-mock .msgs{padding:14px 12px}
  .sms-mock .bubble{margin-bottom:6px}
  .sms-mock .bubble-inner{background:#fff;border-radius:10px 10px 10px 2px;padding:8px 12px;max-width:85%;box-shadow:0 1px 2px rgba(0,0,0,.06);display:inline-block}
  .sms-mock .bubble-inner .text{font-size:13px;color:#1e293b;line-height:1.6}
  .sms-mock .bubble-inner .time{font-size:10px;color:#94a3b8;text-align:right;margin-top:4px}
  
  .chat-mock{background:#e5ddd5;border-radius:10px;overflow:hidden;border:1px solid #e2e8f0;max-width:380px;margin:0 auto}
  .chat-mock .header{padding:10px 14px;display:flex;align-items:center;gap:10px}
  .chat-mock .header .av{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.2);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:12px}
  .chat-mock .header .name{color:#fff;font-size:14px;font-weight:600}
  .chat-mock .header .plat{color:rgba(255,255,255,.67);font-size:10px}
  .chat-mock .msgs{padding:14px 12px}
  .chat-mock .bubble{margin-bottom:6px}
  .chat-mock .bubble-inner{border-radius:10px 10px 10px 2px;padding:7px 11px;max-width:82%;box-shadow:0 1px 1px rgba(0,0,0,.04);display:inline-block;background:#fff}
  
  .ai-mock{max-width:480px;margin:0 auto}
  .ai-mock .img-placeholder{background:linear-gradient(145deg,#1e293b,#334155,#1e293b);border-radius:12px;padding:32px 24px;text-align:center;border:1px solid rgba(255,255,255,.08);margin-bottom:14px}
  .ai-mock .img-placeholder .big{font-size:56px;margin-bottom:12px}
  .ai-mock .img-placeholder p{color:var(--t2);font-size:14px;line-height:1.7}
  .ai-mock .img-placeholder .hint{color:var(--t4);font-size:11px;font-style:italic;margin-top:10px}
  .ai-mock .clues{background:rgba(255,255,255,.04);border-radius:10px;padding:14px;border:1px solid rgba(255,255,255,.08)}
  .ai-mock .clues .title{color:var(--t3);font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
  .ai-mock .clue-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:6px}
  .ai-mock .clue-area{background:rgba(59,130,246,.15);color:#60a5fa;font-size:10px;font-weight:700;border-radius:4px;padding:2px 6px;white-space:nowrap;margin-top:2px}
  .ai-mock .clue-detail{color:var(--t3);font-size:12px;line-height:1.5}
  
  /* ── Result ── */
  #resultScreen{display:none;padding:20px}
  .result-box{max-width:560px;margin:0 auto}
  .score-header{text-align:center;padding:28px 0 20px}
  .score-header .emoji{font-size:48px;margin-bottom:8px}
  .score-header .name{font-size:22px;font-weight:800}
  .score-header .dept{color:var(--t4);font-size:12px;margin-top:2px;margin-bottom:12px}
  .score-big{display:inline-flex;align-items:baseline;gap:4px;background:rgba(255,255,255,.04);border-radius:14px;padding:14px 28px}
  .score-big .num{font-size:44px;font-weight:800}
  .score-big .den{color:var(--t5);font-size:18px}
  .grade-line{margin-top:8px}
  .grade-line .grade{font-size:14px;font-weight:700}
  .grade-line .meta{color:var(--t5);font-size:12px;margin-left:8px}
  .cat-breakdown{background:rgba(255,255,255,.03);border-radius:12px;padding:14px;margin-bottom:16px;border:1px solid var(--border)}
  .cat-row{display:flex;align-items:center;gap:8px;padding:6px 0}
  .cat-row .icon{font-size:14px;width:22px;text-align:center}
  .cat-row .name{color:var(--t2);font-size:12px;flex:1}
  .cat-row .bar{width:60px;height:5px;background:rgba(255,255,255,.06);border-radius:3px;overflow:hidden}
  .cat-row .bar-fill{height:100%;border-radius:3px}
  .cat-row .score{font-size:12px;font-weight:700;width:32px;text-align:right}
  .detail-item{background:rgba(255,255,255,.02);border-radius:8px;margin-bottom:6px;overflow:hidden}
  .detail-item summary{padding:10px 12px;cursor:pointer;display:flex;align-items:center;gap:8px;list-style:none}
  .detail-item summary::-webkit-details-marker{display:none}
  .detail-item .qidx{color:var(--t3);font-size:11px}
  .detail-item .qlbl{color:var(--t2);font-size:12px;flex:1}
  .detail-item .expand{color:var(--t5);font-size:14px}
  .detail-item .detail-body{padding:0 12px 12px}
  .detail-item .detail-body p{color:var(--t3);font-size:12px;line-height:1.6;background:rgba(255,255,255,.02);border-radius:6px;padding:10px}
  
  /* ── Leaderboard Modal ── */
  .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
  .modal-box{background:var(--card);border-radius:16px;padding:20px;max-width:520px;width:100%;max-height:80vh;overflow:auto;border:1px solid var(--border)}
  .modal-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
  .modal-header h2{font-size:18px;font-weight:800}
  .modal-close{background:none;border:none;color:var(--t4);font-size:20px;cursor:pointer}
  .lb-header{display:flex;padding:8px 10px;border-bottom:1px solid var(--border)}
  .lb-header span{color:var(--t5);font-size:10px;font-weight:600}
  .lb-row{display:flex;align-items:center;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.03)}
  .lb-row.top3{background:rgba(255,255,255,.02)}
  .lb-rank{width:32px;font-size:12px;color:var(--t4);font-weight:600}
  .lb-rank.medal{font-size:16px}
  .lb-name{flex:1;font-size:13px}
  .lb-dept{width:100px;color:var(--t4);font-size:11px;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .lb-score{width:50px;text-align:center;font-size:13px;font-weight:700}
  .lb-time{width:50px;text-align:center;color:var(--t4);font-size:11px}
  .lb-date{width:70px;text-align:center;color:var(--t5);font-size:10px}
  .lb-empty{color:var(--t4);font-size:13px;text-align:center;padding:20px}
</style>
</head>
<body>

<!-- ════════════════ START SCREEN ════════════════ -->
<div id="startScreen">
  <div class="start-box">
    <div style="font-size:56px;margin-bottom:12px">🔍</div>
    <h1>Thật hay Giả?</h1>
    <p class="sub">Trắc nghiệm nhận diện email, website, tin nhắn lừa đảo & hình ảnh AI</p>
    <div class="cat-grid" id="catGrid"></div>
    <div class="form-area">
      <label>Họ tên *</label>
      <input id="inputName" placeholder="Nhập họ tên của bạn">
      <label>Phòng ban / Chi nhánh</label>
      <input id="inputDept" placeholder="Ví dụ: Phòng CNTT, CN Tân Bình...">
    </div>
    <div class="btn-row">
      <button class="btn-primary" id="btnStart" disabled onclick="startQuiz()">Bắt đầu làm bài</button>
      <button class="btn-secondary" onclick="showLeaderboard()">🏆 Bảng xếp hạng</button>
    </div>
  </div>
</div>

<!-- ════════════════ QUIZ SCREEN ════════════════ -->
<div id="quizScreen">
  <div class="topbar">
    <div class="qnum" id="qNum"></div>
    <div class="dots" id="dots"></div>
    <div class="timer-area" id="timerArea">
      <div class="timer-bar"><div class="timer-fill" id="timerFill"></div></div>
      <span class="timer-num" id="timerNum"></span>
    </div>
  </div>
  <div class="quiz-body">
    <div class="q-cat" id="qCat"></div>
    <div class="q-prompt" id="qPrompt"></div>
    <div id="mockupArea"></div>
    <div class="answer-btns" id="answerBtns">
      <button class="btn-real" onclick="submitAnswer(true)">✅ THẬT</button>
      <button class="btn-fake" onclick="submitAnswer(false)">❌ GIẢ</button>
    </div>
    <div id="feedbackArea" class="hide"></div>
  </div>
</div>

<!-- ════════════════ RESULT SCREEN ════════════════ -->
<div id="resultScreen">
  <div class="result-box" id="resultBox"></div>
</div>

<!-- ════════════════ LEADERBOARD MODAL ════════════════ -->
<div id="lbModal" class="modal-overlay hide" onclick="closeLB(event)">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-header">
      <h2>🏆 Bảng xếp hạng</h2>
      <button class="modal-close" onclick="document.getElementById('lbModal').classList.add('hide')">✕</button>
    </div>
    <div id="lbContent"></div>
  </div>
</div>

<script>
// ╔══════════════════════════════════════════════════════════════╗
// ║  CẤU HÌNH GOOGLE SHEETS — ĐỔI URL NÀY SAU KHI DEPLOY     ║
// ╚══════════════════════════════════════════════════════════════╝
const SHEET_URL = ""; 
// Để trống = lưu localStorage. Điền URL Apps Script = lưu Google Sheets.
// Ví dụ: "https://script.google.com/macros/s/AKfyc.../exec"

// ══════════════ QUESTION DATA ══════════════

  },
  {
    id:2, category:"Email", type:"email",

    explanation:"Email THẬT! Dấu hiệu: (1) Gửi từ @hdbank.com.vn chính thức, (2) Nội dung thông báo hành chính thông thường, (3) Không yêu cầu click link hay cung cấp thông tin, (4) Hướng dẫn xem chi tiết trên Portal nội bộ.",

      body:"Kính gửi toàn thể CBNV,\n\nCăn cứ theo quy định của Bộ Lao động - TBXH, HDBank thông báo lịch nghỉ lễ Quốc khánh 02/09/2026:\n\n- Thời gian nghỉ: Từ thứ Tư 02/09 đến hết thứ Năm 03/09/2026\n- Ngày đi làm lại: Thứ Sáu 04/09/2026\n\nCác đơn vị chủ động sắp xếp lịch trực theo quy định. Chi tiết xem tại mục Thông báo trên HDBank Portal.\n\nTrân trọng,\nPhòng Nhân sự",
      footer:"HDBank - Ngân hàng TMCP Phát triển TP.HCM"
    }
  },
  {
    id:3, category:"Website", type:"website",

const CAT_ICONS = {Email:"📧",Website:"🌐","Tin nhắn":"💬","Hình ảnh AI":"🤖"};
const MEDALS = ["🥇","🥈","🥉"];
const TIME_PER_Q = 45;

let currentQ = 0, answers = [], timeLeft = TIME_PER_Q, timerInterval = null, startTime = 0;
let userName = "", userDept = "";

// ── Init ──
document.getElementById("inputName").addEventListener("input", e => {
  userName = e.target.value;
  document.getElementById("btnStart").disabled = !userName.trim();
});
document.getElementById("inputDept").addEventListener("input", e => userDept = e.target.value);

// Build category grid
const cats = {};
QUESTIONS.forEach(q => { cats[q.category] = (cats[q.category]||0)+1; });
const catGrid = document.getElementById("catGrid");
Object.entries(cats).forEach(([cat,n]) => {
  catGrid.innerHTML += `<div class="cat-card"><span class="icon">${CAT_ICONS[cat]}</span><div><div class="lbl">${cat}</div><div class="cnt">${n} câu hỏi</div></div></div>`;
});

// ══════════════ MOCKUP RENDERERS ══════════════
function renderMockup(m) {
  if (m.type === "email") return renderEmail(m);
  if (m.type === "website") return renderWebsite(m);
  if (m.type === "sms") return renderSMS(m);
  if (m.type === "chat") return renderChat(m);
  if (m.type === "ai_image") return renderAIImage(m);
  return "";
}

function renderEmail(d) {
  return `<div class="email-mock">
    <div class="toolbar"><div class="circ" style="background:#ef4444"></div><div class="circ" style="background:#f59e0b"></div><div class="circ" style="background:#22c55e"></div><span style="margin-left:8px;color:#94a3b8;font-size:11px">Mail</span></div>
    <div class="body">
      <div class="sender"><div class="avatar">${d.fromDisplay.charAt(0)}</div><div><div class="from-name">${d.fromDisplay}</div><div class="from-addr">&lt;${d.from}&gt;</div></div></div>
      <div class="subject">${d.subject}</div>
      <div class="to">Đến: ${d.to}</div>
      <div class="content">${d.body}</div>
      ${d.button ? `<div><div class="cta">${d.button}</div>${d.buttonUrl ? `<div class="link-preview">🔗 ${d.buttonUrl}</div>` : ""}</div>` : ""}
      ${d.footer ? `<div class="footer">${d.footer}</div>` : ""}
    </div></div>`;
}

function renderWebsite(d) {
  let fieldsHtml = d.fields.map(f => `<div class="field"><label>${f}</label><div class="input">Nhập ${f.toLowerCase()}</div></div>`).join("");
  let extrasHtml = d.extras.map(e => `<span>${e}</span>`).join("");
  return `<div class="web-mock">
    <div class="browser-bar">
      <div class="browser-dots"><span style="background:#ef4444"></span><span style="background:#f59e0b"></span><span style="background:#22c55e"></span></div>
      <div class="url-bar"><span class="lock">${d.ssl?"🔒":"⚠️"}</span><span class="url">${d.url}</span></div>
      ${d.ssl?`<div class="ssl-info">Chứng chỉ: ${d.sslIssuer}</div>`:""}
    </div>
    <div class="page"><div class="logo">${d.logo}</div><div class="title">${d.title}</div>${fieldsHtml}<div class="submit">${d.button}</div><div class="extras">${extrasHtml}</div></div></div>`;
}

function renderSMS(d) {
  let msgsHtml = d.messages.map(m => `<div class="bubble"><div class="bubble-inner"><div class="text">${m.text}</div><div class="time">${m.time}</div></div></div>`).join("");
  return `<div class="sms-mock">
    <div class="header"><div class="av">SMS</div><div><div class="name">${d.sender}</div><div class="type">SMS Brandname</div></div></div>
    <div class="msgs">${msgsHtml}</div></div>`;
}

function renderChat(d) {
  let msgsHtml = d.messages.map(m => `<div class="bubble"><div class="bubble-inner" style="background:${m.fromSender?"#fff":"#dcf8c6"};border-radius:${m.fromSender?"10px 10px 10px 2px":"10px 10px 2px 10px"}"><div class="text" style="font-size:13px;color:#1e293b;line-height:1.5">${m.text}</div><div class="time" style="font-size:10px;color:#94a3b8;text-align:right;margin-top:2px">${m.time}</div></div></div>`).join("");

function renderAIImage(d) {
  let cluesHtml = d.clues.map(c => `<div class="clue-item"><span class="clue-area">${c.area}</span><span class="clue-detail">${c.detail}</span></div>`).join("");
  return `<div class="ai-mock">
    <div class="img-placeholder"><div class="big"><img src="3.png" alt="Email giả lập">

// ══════════════ QUIZ ENGINE ══════════════
function showScreen(id) {
  ["startScreen","quizScreen","resultScreen"].forEach(s => {
    const el = document.getElementById(s);
    el.style.display = s === id ? (s === "quizScreen" ? "flex" : (s === "startScreen" ? "flex" : "block")) : "none";
  });
}

function startQuiz() {
  if (!userName.trim()) return;
  currentQ = 0; answers = []; startTime = Date.now();
  showScreen("quizScreen");
  renderQuestion();
}

function renderQuestion() {
  const q = QUESTIONS[currentQ];
  document.getElementById("qNum").innerHTML = `${currentQ+1} <span>/ ${QUESTIONS.length}</span>`;
  
  // Dots
  let dotsHtml = "";
  QUESTIONS.forEach((_,i) => {
    let cls = "dot";
    if (i < answers.length) cls += answers[i].isCorrect ? " correct" : " wrong";
    else if (i === currentQ) cls += " active";
    dotsHtml += `<div class="${cls}"></div>`;
  });
  document.getElementById("dots").innerHTML = dotsHtml;
  
  document.getElementById("qCat").innerHTML = `<span style="font-size:16px">${CAT_ICONS[q.category]}</span><span class="badge">${q.category}</span>`;
  document.getElementById("qPrompt").textContent = q.prompt;
  document.getElementById("mockupArea").innerHTML = renderMockup(q.mockup);
  document.getElementById("answerBtns").classList.remove("hide");
  document.getElementById("feedbackArea").classList.add("hide");
  document.getElementById("timerArea").style.display = "flex";
  
  timeLeft = TIME_PER_Q;
  startTimer();
}

function startTimer() {
  clearInterval(timerInterval);
  updateTimerUI();
  timerInterval = setInterval(() => {
    timeLeft--;
    updateTimerUI();
    if (timeLeft <= 0) { clearInterval(timerInterval); submitAnswer(null); }
  }, 1000);
}

function updateTimerUI() {
  const pct = (timeLeft / TIME_PER_Q) * 100;
  const color = timeLeft <= 5 ? "var(--red)" : timeLeft <= 10 ? "var(--yellow)" : "var(--blue)";
  document.getElementById("timerFill").style.cssText = `width:${pct}%;background:${color}`;
  const tn = document.getElementById("timerNum");
  tn.textContent = timeLeft;
  tn.style.color = color;
}

function submitAnswer(choice) {
  clearInterval(timerInterval);
  const q = QUESTIONS[currentQ];
  const isCorrect = choice === q.answer;
  answers.push({ qId: q.id, selected: choice, correct: q.answer, isCorrect });
  
  document.getElementById("answerBtns").classList.add("hide");
  document.getElementById("timerArea").style.display = "none";
  
  // Update dot
  const dots = document.getElementById("dots").children;
  dots[currentQ].className = "dot " + (isCorrect ? "correct" : "wrong");
  
  let fbColor, fbBorder, icon, label;
  if (choice === null) { fbColor = "rgba(245,158,11,.08)"; fbBorder = "rgba(245,158,11,.2)"; icon = "⏰"; label = `<span style="color:#fbbf24">Hết giờ!</span>`; }
  else if (isCorrect) { fbColor = "rgba(22,163,74,.08)"; fbBorder = "rgba(22,163,74,.2)"; icon = "🎉"; label = `<span style="color:#4ade80">Chính xác!</span>`; }
  else { fbColor = "rgba(220,38,38,.08)"; fbBorder = "rgba(220,38,38,.2)"; icon = "💡"; label = `<span style="color:#f87171">Chưa đúng!</span>`; }
  
  const ansBadge = q.answer
    ? `<span class="ans-badge" style="background:rgba(22,163,74,.15);color:#4ade80">Đáp án: THẬT</span>`
    : `<span class="ans-badge" style="background:rgba(220,38,38,.15);color:#f87171">Đáp án: GIẢ</span>`;
  
  const btnLabel = currentQ + 1 >= QUESTIONS.length ? "Xem kết quả 📊" : "Câu tiếp theo →";
  
  const fb = document.getElementById("feedbackArea");
  fb.className = "feedback";
  fb.style.background = fbColor;
  fb.style.border = `1px solid ${fbBorder}`;
  fb.innerHTML = `<div class="head"><span class="icon">${icon}</span>${label}${ansBadge}</div><p>${q.explanation}</p><div class="next-btn"><button class="btn-primary" onclick="nextQuestion()">${btnLabel}</button></div>`;
}

function nextQuestion() {
  if (currentQ + 1 >= QUESTIONS.length) { showResult(); return; }
  currentQ++;
  renderQuestion();
}

// ══════════════ RESULT ══════════════
function showResult() {
  showScreen("resultScreen");
  const score = answers.filter(a=>a.isCorrect).length;
  const pct = Math.round((score/QUESTIONS.length)*100);
  const totalTime = Math.round((Date.now()-startTime)/1000);
  
  let gradeEmoji, gradeLabel, gradeColor;
  if (pct>=90){gradeEmoji="🏆";gradeLabel="Xuất sắc";gradeColor="#16a34a";}
  else if(pct>=70){gradeEmoji="👍";gradeLabel="Khá";gradeColor="#2563eb";}
  else if(pct>=50){gradeEmoji="📖";gradeLabel="Trung bình";gradeColor="#d97706";}
  else{gradeEmoji="⚠️";gradeLabel="Cần cải thiện";gradeColor="#dc2626";}
  
  // Category breakdown
  const catSet = [...new Set(QUESTIONS.map(q=>q.category))];
  let catHtml = catSet.map(cat => {
    const qs = QUESTIONS.filter(q=>q.category===cat);
    const correct = qs.filter(q=>answers.find(a=>a.qId===q.id)?.isCorrect).length;
    const p = Math.round((correct/qs.length)*100);
    const c = p===100?"#22c55e":p>=50?"#3b82f6":"#ef4444";
    return `<div class="cat-row"><span class="icon">${CAT_ICONS[cat]}</span><span class="name">${cat}</span><div class="bar"><div class="bar-fill" style="width:${p}%;background:${c}"></div></div><span class="score" style="color:${c}">${correct}/${qs.length}</span></div>`;
  }).join("");
  
  // Detailed answers
  let detailHtml = QUESTIONS.map((q,i) => {
    const a = answers[i];
    const icon = a.selected===null?"⏰":a.isCorrect?"✅":"❌";
    const borderC = a.selected===null?"rgba(245,158,11,.1)":a.isCorrect?"rgba(22,163,74,.1)":"rgba(220,38,38,.1)";
    return `<details class="detail-item" style="border:1px solid ${borderC}"><summary><span style="font-size:14px">${icon}</span><span class="qidx">Câu ${i+1}</span><span class="qlbl">${q.category}: ${q.answer?"Thật":"Giả"}</span><span class="expand">›</span></summary><div class="detail-body"><p>${q.explanation}</p></div></details>`;
  }).join("");
  
  document.getElementById("resultBox").innerHTML = `
    <div class="score-header">
      <div class="emoji">${gradeEmoji}</div>
      <div class="name">${userName}</div>
      ${userDept?`<div class="dept">${userDept}</div>`:""}
      <div class="score-big"><span class="num" style="color:${gradeColor}">${score}</span><span class="den">/ ${QUESTIONS.length}</span></div>
      <div class="grade-line"><span class="grade" style="color:${gradeColor}">${gradeLabel}</span><span class="meta">• ${pct}% • ${totalTime}s</span></div>
    </div>
    <div class="cat-breakdown">${catHtml}</div>
    <div style="margin-bottom:16px">${detailHtml}</div>
    <div class="btn-row" style="padding-bottom:32px">
      <button class="btn-primary" id="btnSave" onclick="saveAndShowLB()">💾 Lưu điểm & Xem BXH</button>
      <button class="btn-secondary" onclick="retry()">🔄 Làm lại</button>
    </div>`;
  
  // Auto-save score data
  window._lastScore = {name:userName.trim(),dept:userDept.trim(),score,total:QUESTIONS.length,pct,time:totalTime,date:new Date().toISOString()};
}

function retry() {
  showScreen("startScreen");
}

// ══════════════ STORAGE (Google Sheets or localStorage) ══════════════
async function saveScore(entry) {
  if (SHEET_URL) {
    try {
      await fetch(SHEET_URL, {method:"POST", mode:"no-cors", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({action:"save", ...entry})
      });
    } catch(e) { console.error("Sheet save error:", e); }
  }
  // Always also save to localStorage as backup
  const list = JSON.parse(localStorage.getItem("quiz_lb") || "[]");
  list.push(entry);
  list.sort((a,b) => b.score - a.score || a.time - b.time);
  localStorage.setItem("quiz_lb", JSON.stringify(list.slice(0,200)));
}

async function loadScores() {
  if (SHEET_URL) {
    try {
      const r = await fetch(SHEET_URL + "?action=get");
      const data = await r.json();
      if (Array.isArray(data)) return data;
    } catch(e) { console.error("Sheet load error:", e); }
  }
  return JSON.parse(localStorage.getItem("quiz_lb") || "[]");
}

async function saveAndShowLB() {
  const btn = document.getElementById("btnSave");
  btn.textContent = "⏳ Đang lưu...";
  btn.disabled = true;
  await saveScore(window._lastScore);
  btn.textContent = "✅ Đã lưu!";
  showLeaderboard();
}

async function showLeaderboard() {
  const data = await loadScores();
  renderLB(data);
  document.getElementById("lbModal").classList.remove("hide");
}

function renderLB(data) {
  if (!data.length) {
    document.getElementById("lbContent").innerHTML = `<p class="lb-empty">Chưa có ai hoàn thành bài trắc nghiệm</p>`;
    return;
  }
  data.sort((a,b) => b.score - a.score || a.time - b.time);
  let rows = data.slice(0,30).map((e,i) => {
    const rankClass = i < 3 ? "lb-rank medal" : "lb-rank";
    const rankText = i < 3 ? MEDALS[i] : (i+1);
    const rowClass = i < 3 ? "lb-row top3" : "lb-row";
    const nameW = i < 3 ? 600 : 400;
    const nameC = i < 3 ? "var(--t1)" : "var(--t2)";
    const scoreC = e.pct >= 70 ? "#4ade80" : e.pct >= 50 ? "#fbbf24" : "#f87171";
    const dateStr = e.date ? new Date(e.date).toLocaleDateString("vi-VN",{day:"2-digit",month:"2-digit"}) : "";
    return `<div class="${rowClass}"><span class="${rankClass}">${rankText}</span><span class="lb-name" style="font-weight:${nameW};color:${nameC}">${e.name}</span><span class="lb-dept">${e.dept||"—"}</span><span class="lb-score" style="color:${scoreC}">${e.score}/${e.total}</span><span class="lb-time">${e.time}s</span><span class="lb-date">${dateStr}</span></div>`;
  }).join("");
  
  document.getElementById("lbContent").innerHTML = `
    <div class="lb-header"><span style="width:32px">#</span><span style="flex:1">HỌ TÊN</span><span style="width:100px;text-align:center">PHÒNG BAN</span><span style="width:50px;text-align:center">ĐIỂM</span><span style="width:50px;text-align:center">T.GIAN</span><span style="width:70px;text-align:center">NGÀY</span></div>
    ${rows}
    <div style="text-align:center;padding:12px 0;color:var(--t5);font-size:11px">Tổng: ${data.length} lượt tham gia</div>`;
}

function closeLB(e) { if (e.target === document.getElementById("lbModal")) document.getElementById("lbModal").classList.add("hide"); }
</script>
</body>
</html>
